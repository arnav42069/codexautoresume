name: Linux and macOS builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64}
          - {os: ubuntu-24.04-arm, rid: linux-arm64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libfontconfig1 libice6 libsm6 libxrandr2 libxi6 libxcursor1
      - run: npm ci --ignore-scripts
      - name: Test scheduler, discovery and shortcuts
        run: python3 scripts/ci-run.py dotnet run --project tests/CodexAutoResume.Tests -c Release
      - name: Test npm installer and launcher
        run: python3 scripts/ci-run.py npm test
      - name: Publish native app and diagnostic
        run: python3 scripts/ci-run.py bash scripts/build-desktop.sh ${{ matrix.rid }}
      - name: Check native window and desktop shortcut
        run: python3 scripts/ci-run.py python3 scripts/test-desktop.py ${{ matrix.rid }}
      - name: Check npm release installation when published
        run: python3 scripts/ci-run.py bash scripts/npm-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodexAutoResume-${{ matrix.rid }}
          path: |
            artifacts/CodexAutoResume-${{ matrix.rid }}.zip
            artifacts/CodexAutoResume-DesktopProbe-${{ matrix.rid }}.zip
