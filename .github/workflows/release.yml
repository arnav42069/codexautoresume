name: Release desktop builds
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Test and package Windows app and diagnostic
        shell: pwsh
        run: |
          ./scripts/build.ps1
          dotnet publish tools/CodexAutoResume.Probe -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/desktop-probe-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic publish failed.' }
          Copy-Item docs/DESKTOP-FEASIBILITY.md artifacts/desktop-probe-win-x64/README.md
          Copy-Item LICENSE artifacts/desktop-probe-win-x64/LICENSE
          Compress-Archive -Path artifacts/desktop-probe-win-x64/* -DestinationPath artifacts/CodexAutoResume-DesktopProbe-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CodexAutoResume-win-x64
          path: |
            artifacts/CodexAutoResume-win-x64.zip
            artifacts/CodexAutoResume-DesktopProbe-win-x64.zip
  publish:
    needs: [windows, platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums and npm release manifest
        run: python3 scripts/release-manifest.py "$GITHUB_REF_NAME"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS.txt artifacts/npm-manifest.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Codex AutoResume $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Verify public release and downloads
        run: python3 scripts/verify-release.py "$GITHUB_REF_NAME"
