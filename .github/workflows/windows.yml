name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Test npm installer and launcher
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $testOutput = & node --test tests/npm/cli.test.cjs tests/npm/installer.test.cjs 2>&1
          $testExit = $LASTEXITCODE
          $testOutput | Write-Output
          if ($testExit -ne 0) {
            $testOutput | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $details = $testOutput | Out-String
            if ($details.Length -gt 3500) { $details = $details.Substring($details.Length - 3500) }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=npm tests::$details"
            exit $testExit
          }
      - name: Install from GitHub archive, check native startup, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $prefix = Join-Path $env:RUNNER_TEMP 'autoresume-npm-smoke'
          try {
            $packed = npm pack --ignore-scripts --json --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
            if ($packed.files.path -match '\.(exe|zip)$') { throw 'Compiled files must stay in GitHub Releases' }
            $tarball = Join-Path $env:RUNNER_TEMP $packed.filename
            $installOutput = & npm install --foreground-scripts --global --prefix $prefix $tarball 2>&1
            $installExit = $LASTEXITCODE
            $installOutput | Write-Output
            if ($installExit -ne 0) { throw ('Tarball install: ' + ($installOutput | Out-String)) }
            npm uninstall --global --prefix $prefix codexautoresume
            if ($LASTEXITCODE -ne 0) { throw 'Tarball uninstall failed' }
            $installOutput = & npm install --foreground-scripts --global --prefix $prefix "https://github.com/$env:GITHUB_REPOSITORY/archive/$env:GITHUB_SHA.tar.gz" 2>&1
            $installExit = $LASTEXITCODE
            $installOutput | Write-Output
            if ($installExit -ne 0) { throw ($installOutput | Out-String) }
            $command = Join-Path $prefix 'codexautoresume.cmd'
            & $command --version
            if ($LASTEXITCODE -ne 0) { throw 'npm launcher version check failed' }
            & $command --self-test
            if ($LASTEXITCODE -ne 0) { throw 'npm launcher native startup failed' }
            & $command install --probe
            if ($LASTEXITCODE -ne 0) { throw 'Optional diagnostic installation failed' }
            npm uninstall --global --prefix $prefix codexautoresume
            if ($LASTEXITCODE -ne 0) { throw 'npm uninstall failed' }
            if (Test-Path $command) { throw 'npm command was not removed' }
            if (Test-Path (Join-Path $prefix 'node_modules/codexautoresume')) { throw 'npm package was not removed' }
            'GitHub archive npm install, checksum verification, native startup, diagnostic install and uninstall passed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } catch {
            $_ | Out-String | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $details = $_ | Out-String
            if ($details.Length -gt 3500) { $details = $details.Substring($details.Length - 3500) }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=npm smoke test::$details"
            throw
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Check automatic discovery and read-only connection to the official Codex CLI
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'official-codex-discovery'
          npm install --global --prefix $prefix @openai/codex@0.163.0
          if ($LASTEXITCODE -ne 0) { throw 'Official Codex installation failed' }
          $env:PATH = $prefix + ';' + $env:PATH
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'codex-read-only-smoke'
          New-Item -ItemType Directory -Path $env:CODEX_HOME -Force | Out-Null
          python scripts/ci-run.py dotnet run --project tests/CodexAutoResume.Tests -c Release -- --live-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Automatic official Codex discovery/initialization failed' }
      - name: Test, publish, and check native UI startup
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Phosphor-screenshots
          path: artifacts/ui-screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: CodexAutoResume-win-x64
          path: artifacts/CodexAutoResume-win-x64.zip
